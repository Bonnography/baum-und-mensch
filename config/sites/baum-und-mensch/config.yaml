base: 'https://baum-und-mensch.de/'
baseVariants:
  -
    base: 'https://baum-und-mensch.codebomb-websolutions.de/'
    condition: 'applicationContext == "Development"'
  -
    base: 'https://baum-und-mensch-ddev.ddev.site/'
    condition: 'applicationContext == "Development/Ddev"'
disableStaticFileCache: false
languages:
  -
    title: Deutsch
    enabled: true
    languageId: 0
    base: /
    locale: de_DE.UTF-8
    navigationTitle: Deutsch
    flag: de
    hreflang: de-DE
    websiteTitle: ''
  -
    title: English
    enabled: true
    locale: en_US.utf8
    hreflang: en-US
    base: /en/
    websiteTitle: ''
    navigationTitle: English
    fallbackType: strict
    fallbacks: ''
    flag: en-us-gb
    languageId: 1
rootPageId: 1
websiteTitle: ''

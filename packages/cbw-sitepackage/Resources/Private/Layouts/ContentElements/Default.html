<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:spaceless>
    <f:switch expression="{data.CType}">
        <f:case value="news">
            <f:variable name="ce-class" value="news" />
        </f:case>
        <f:case value="textmedia">
            <f:variable name="ce-class" value="textmedia" />
        </f:case>
        <f:case value="text">
            <f:variable name="ce-class" value="text" />
        </f:case>
        <f:case value="pagesOverview">
            <f:variable name="ce-class" value="pagesOverview" />
        </f:case>
        <f:case value="inlineElements">
            <f:variable name="ce-class" value="inlineElements" />
        </f:case>
        <f:case value="headline">
            <f:variable name="ce-class" value="headline" />
        </f:case>
        <f:case value="image">
            <f:variable name="ce-class" value="image" />
        </f:case>
        <f:case value="slider">
            <f:variable name="ce-class" value="slider" />
        </f:case>
        <f:case value="form_formframework">
            <f:variable name="ce-class" value="content-form" />
        </f:case>
    </f:switch>
</f:spaceless>
<div id="c{data.uid}" class="content {ce-class} content-padding__{data.change_space_top}-{data.change_space_bottom} {f:if(condition: '{data.layout} != 0', then: '{f:render(partial:\'Background/Background\', arguments:\'{data: data}\')}')}">
    <f:if condition="{data.CType} == 'form_formframework'">
        <f:then>
            <f:if condition="{data.header}">
                <f:render partial="Header/All" arguments="{_all}"/>
            </f:if>
            <f:render section="Main" optional="true"/>
        </f:then>
        <f:else>
            <f:render section="Main" optional="true"/>
        </f:else>
    </f:if>
</div>
</html>

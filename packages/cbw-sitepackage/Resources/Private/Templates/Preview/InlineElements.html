<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<div class="row" style="padding: 10px 0;">
    <f:for each="{tx_inline_item}" as="item">
        <div class="col-sm-3">
            <f:if condition="{item.header}">
                <b>{item.header}</b><br>
            </f:if>
            <f:if condition="{item.bodytext}">
                {item.bodytext -> f:format.stripTags() -> f:format.crop(maxCharacters: 80)}<br>
            </f:if>
            <f:if condition="{item.image}">
                <f:for each="{item.image}" as="image">
                    <f:image image="{image}" maxWidth="100" style="padding: 5px 5px 0 0;" />
                </f:for>
            </f:if>
        </div>
    </f:for>
</div>

</html>

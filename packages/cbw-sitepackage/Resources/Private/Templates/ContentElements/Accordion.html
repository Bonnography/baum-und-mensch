<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default"/>
<f:section name="Main">
    <f:if condition="{data.header}">
        <f:render section="Header" optional="true">
            <f:render partial="Header/All" arguments="{_all}" />
        </f:render>
    </f:if>
    <f:if condition="{accordionElements}">
        <div class="accordion" id="accordion{data.uid}">
            <f:for each="{accordionElements}" as="element" iteration="accordionIterator">
                <div class="accordion-item">
                    <div class="accordion-header" id="heading-{accordionIterator.index}">
                        <h3>
                            <button class="accordion-button{f:if(condition: '{accordionIterator.isFirst}', else: ' collapsed')}" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-{accordionIterator.index}" aria-expanded="{f:if(condition: '{accordionIterator.isFirst}', then: 'true', else: 'false')}" aria-controls="collapse-{accordionIterator.index}">
                                {element.data.header}
                            </button>
                        </h3>
                    </div>
                    <div id="collapse-{accordionIterator.index}" class="accordion-collapse collapse{f:if(condition: '{accordionIterator.isFirst}', then: ' show')}" data-bs-parent="#accordion{data.uid}">
                        <div class="accordion-body">
                            <f:if condition="{element.images}">
                                <f:then>
                                    <div class="row">
                                        <div class="col-md-4">
                                            <f:for each="{element.images}" as="image">
                                                <f:render partial="Media/Type" arguments="{file: image, dimensions: image.dimensions, data: data, settings: settings}"/>
                                            </f:for>
                                        </div>
                                        <div class="col-md-8">
                                            <f:format.html parseFuncTSPath="lib.parseFunc_RTE"> <f:spaceless>{element.data.bodytext}</f:spaceless></f:format.html>
                                        </div>
                                    </div>
                                </f:then>
                                <f:else>
                                    <f:format.html parseFuncTSPath="lib.parseFunc_RTE"> <f:spaceless>{element.data.bodytext}</f:spaceless></f:format.html>
                                </f:else>
                            </f:if>
                        </div>
                    </div>
                </div>

            </f:for>
        </div>
    </f:if>

</f:section>
</html>
